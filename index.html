<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1인 기업가를 위한 무인 세일즈 배관 시스템</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Specific Styles for VSL Squeeze Page */
        .vsl-hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            max-width: 900px;
            margin: 0 auto;
            padding: 4rem 1rem 2rem;
        }

        .eyebrow {
            color: var(--accent-gold);
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }

        .main-headline {
            font-size: 2.8rem;
            line-height: 1.2;
            margin-bottom: 1.5rem;
            color: #ffffff;
        }

        .highlight-text {
            background: linear-gradient(to right, #F59E0B, #FDE68A);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            border-bottom: 4px solid #F59E0B;
            padding-bottom: 2px;
        }

        .sub-headline {
            font-size: 1.25rem;
            color: var(--text-secondary);
            max-width: 700px;
            margin: 0 auto 3rem;
            font-weight: 400;
        }

        .optin-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
            width: 100%;
            max-width: 800px;
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4), 0 0 40px rgba(139, 92, 246, 0.15);
        }

        .native-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .native-input {
            width: 100%;
            padding: 1.2rem;
            background: #111827;
            border: 1px solid #374151;
            color: white;
            border-radius: 8px;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }

        .native-input:focus {
            outline: none;
            border-color: var(--accent-gold);
            box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.2);
        }

        .guarantee-text {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            color: #6B7280;
            font-size: 0.9rem;
            margin-top: 1rem;
        }

        @media (min-width: 768px) {
            .main-headline { font-size: 3.5rem; }
            .optin-container { padding: 3rem; }
        }
    </style>
</head>
<body>
    <div class="container" style="max-width: 1200px;">
        <div class="vsl-hero">
            <div class="eyebrow">무료 마스터클래스 VOD 한정 배포</div>
            <h1 class="main-headline">블로그 1일 1포스팅을 멈추고<br><span class="highlight-text">월 천만 원 자동 수익</span>을 만드는 법</h1>
            <p class="sub-headline">상위 1% 1인 기업가들만이 몰래 사용하던 'AI 무인 세일즈 배관'의 비밀을 5일 압축 영상으로 완벽하게 공개합니다.</p>

            <!-- Video Player (VSL) -->
            <div class="video-wrapper" style="width: 100%; max-width: 800px; border-radius: 12px; overflow: hidden; margin-bottom: -3rem; position: relative; z-index: 10;">
                <img src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?ixlib=rb-4.0.3&auto=format&fit=crop&w=1600&q=80" alt="비디오 재생" style="width: 100%; display: block; opacity: 0.7;">
                <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 80px; height: 80px; background: var(--accent-gold); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 0 30px rgba(245, 158, 11, 0.6);">
                    <div style="width: 0; height: 0; border-style: solid; border-width: 15px 0 15px 25px; border-color: transparent transparent transparent #000; margin-left: 5px;"></div>
                </div>
            </div>
            
            <div style="height: 4rem;"></div>

            <!-- Sleek Native Opt-in Form -->
            <div class="optin-container">
                <div style="text-align: center; margin-bottom: 1rem;">
                    <h2 style="font-size: 1.5rem; margin-bottom: 0.5rem;">🚨 5일 VOD 챌린지 1일 차 받기</h2>
                    <p style="color: var(--text-secondary); font-size: 1rem;">아래 이메일로 1일 차 영상을 즉시 보내드립니다. (선착순 50명)</p>
                </div>

                <form action="thankyou.html" method="GET" class="native-form">
                    <input type="text" class="native-input" placeholder="대표님 성함" required>
                    <input type="email" class="native-input" placeholder="자료 받으실 이메일 주소" required>
                    <button type="submit" class="cta-button" style="padding: 1.5rem; font-size: 1.3rem;">지금 1일 차 영상 무료 시청하기 ➔</button>
                </form>

                <div class="guarantee-text">
                    <svg width="16" height="16" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"></path></svg>
                    <span>입력하신 정보는 100% 안전하게 보호되며 스팸메일을 보내지 않습니다.</span>
                </div>
            </div>
        </div>

        <footer style="text-align: center; padding: 4rem 0 2rem; color: #4B5563; font-size: 0.9rem;">
            <p>&copy; 2026 GrowthAI Inc. All Rights Reserved. | 개인정보처리방침</p>
        </footer>
    </div>
</body>
</html>
